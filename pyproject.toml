[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofrail"
version = "0.1.0"
description = "Portable, verifiable work and payment receipts for autonomous agents"
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
readme = "README.md"

[project.scripts]
proofrail = "proofrail.cli:main"
