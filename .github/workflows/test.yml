name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  stellar-x402-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/stellar-x402
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/stellar-x402/package-lock.json
      - run: npm ci
      - run: npm test
